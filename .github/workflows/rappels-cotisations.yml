
name: Rappels automatiques des cotisations

on:
  schedule:
    - cron: "15 11 * * *"

  workflow_dispatch:
    inputs:
      rappel_exceptionnel:
        description: "Créer les rappels exceptionnels du jour"
        required: false
        type: boolean
        default: false

      renvoyer_push_existants:
        description: "Réessayer l'envoi push des 34 rappels existants"
        required: false
        type: boolean
        default: false

jobs:
  rappels-cotisations:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Créer les credentials Firebase
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > backend/firebase-credentials.json

      - name: Envoyer les rappels habituels ou exceptionnels
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.renvoyer_push_existants) }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_CREDENTIALS_PATH: ./firebase-credentials.json
          RAPPEL_EXCEPTIONNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.rappel_exceptionnel || false }}
        run: |
          python -m app.scripts.rappels_cotisations

      - name: Reprendre les notifications push existantes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.renvoyer_push_existants }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_CREDENTIALS_PATH: ./firebase-credentials.json
        run: |
          python -m app.scripts.renvoyer_push_rappels_cotisations --envoyer

      - name: Supprimer les credentials Firebase
        if: always()
        run: |
          rm -f backend/firebase-credentials.json
