name: Rappels automatiques des cotisations

on:
  schedule:
    - cron: "15 11 * * *"

  workflow_dispatch:

jobs:
  rappels-cotisations:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Créer les credentials Firebase
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > backend/firebase-credentials.json

      - name: Envoyer les rappels de cotisation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_CREDENTIALS_PATH: ./firebase-credentials.json
        run: |
          python -m app.scripts.rappels_cotisations

      - name: Supprimer les credentials Firebase
        if: always()
        run: |
          rm -f backend/firebase-credentials.json